name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build and Release
    runs-on: ubuntu-24.04
    environment: 'rpm signing'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libfuse3-dev \
            libgtk-4-dev \
            libadwaita-1-dev \
            libwebkitgtk-6.0-dev \
            libsecret-1-dev \
            libdbus-1-dev \
            desktop-file-utils \
            libimage-exiftool-perl \
            rpm

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: '1.96'
          components: rustfmt, clippy

      - name: Cache Cargo target
        uses: swatinem/rust-cache@v2

      - name: Verify tag and manifest versions
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          manifest_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          pkgbuild_version="$(sed -n 's/^pkgver=//p' packaging/PKGBUILD | head -n1)"
          test "$tag_version" = "$manifest_version"
          test "$tag_version" = "$pkgbuild_version"

      - name: Release quality gates
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --locked
          scripts/fuse-acceptance.sh --offline-only

      - name: Build release binaries
        run: |
          cargo build --release --locked

      - name: Determine version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            # Extract version from tag (e.g. v0.1.0 -> 0.1.0)
            VERSION=${GITHUB_REF#refs/tags/}
            VERSION=${VERSION#v}
          else
            # Fallback for manual workflow runs: extract version from Cargo.toml
            VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
            VERSION="${VERSION}-dev-${GITHUB_SHA::7}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Building version: $VERSION"

      - name: Package raw binaries and Debian package
        run: |
          packaging/package-release.sh "${{ env.VERSION }}" "$PWD/dist"

      - name: Package Fedora package (.rpm)
        run: |
          # Sanitize version (replace hyphens with dots for RPM compatibility)
          RPM_VERSION=$(echo "${{ env.VERSION }}" | tr '-' '.')
          
          # Create RPM build directories
          mkdir -p rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS,BUILDROOT,db}
          
          # Build RPM package
          rpmbuild -bb \
            --nodeps \
            --define "_topdir $PWD/rpmbuild" \
            --define "_sourcedir $PWD" \
            --define "git_dir $PWD" \
            --define "version ${RPM_VERSION}" \
            --define "_dbpath $PWD/rpmbuild/db" \
            packaging/proton-drive-linux.spec
            
          # Keep every release artifact in one directory.
          cp rpmbuild/RPMS/x86_64/*.rpm dist/

      - name: Sign Fedora package (.rpm)
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_KEY_NAME: ${{ secrets.GPG_KEY_NAME }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ] && [ -n "$GPG_KEY_NAME" ]; then
            echo "$GPG_PRIVATE_KEY" | gpg --batch --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --import
            
            cat <<EOF > ~/.rpmmacros
          %_signature gpg
          %_gpg_name ${GPG_KEY_NAME}
          %__gpg_sign_cmd %{__gpg} gpg --batch --verbose --no-armor --pinentry-mode loopback --passphrase %{_gpg_passphrase} --no-secmem-warning -u "%{_gpg_name}" -sbo %{__signature_filename} --digest-algo sha256 %{__plaintext_filename}
          EOF
          
            rpm --addsign --define "_gpg_passphrase $GPG_PASSPHRASE" dist/*.rpm
          else
            echo "Skipping RPM signing: GPG_PRIVATE_KEY or GPG_KEY_NAME secret is not set."
          fi

      - name: Write release checksums
        run: |
          cd dist
          sha256sum ./*.deb ./*.tar.gz ./*.rpm > SHA256SUMS

      - name: Upload Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: proton-drive-linux-builds
          path: dist/
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.tar.gz
            dist/*.rpm
            dist/SHA256SUMS
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
